[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-ml-okvir"
version = "1.0.0"
description = "Mini okvir za ML eksperimente sa primjerima obrazaca dizajna"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.3,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
